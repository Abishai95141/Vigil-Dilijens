name: integration

# The cluster-backed lanes (techstack §12). Kept off the per-PR critical path (the
# hermetic `ci.yml` gates PRs); these run nightly + on demand so the default loop stays
# fast while the live pipeline is exercised regularly.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # nightly ~02:17 UTC

permissions:
  contents: read

jobs:
  kind:
    name: kind cluster + identity/clock integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: helm/kind-action@v1
        with:
          config: deploy/kind/cluster.yaml
          cluster_name: vigil
      - name: "identity + clock integration tests (build tag: integration)"
        run: go test -race -tags=integration ./obsd/internal/identity/ ./obsd/internal/clock/

  e2e:
    name: live e2e (detection + restraint + replay determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: helm/kind-action@v1
        with:
          config: deploy/kind/cluster.yaml
          cluster_name: vigil
      # helm/kind-action writes the kubeconfig into the default location; the suite
      # resolves it via KUBECONFIG / ~/.kube/config and builds obsd + replay itself.
      - name: "live e2e suite (build tag: integration)"
        run: go test -tags=integration -count=1 -timeout=30m ./obsd/internal/e2e/ -run TestLive -v

  forecast:
    name: forecast pipeline plumbing smoke (stub clock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Exercises the REAL forecast pipeline plumbing end-to-end (replay -forecast ->
      # clockd -> export-parquet -> harness.forecast_gate) with the zero-knowledge STUB
      # clock — cheap, no model download. The gate correctly returns INSUFFICIENT on the
      # short smoke bundle (a stub has no skill), so we assert only that a VERDICT was
      # produced (the plumbing is intact). The real-model SKILL gate of record is
      # `just forecast-gate <real-bundle>` (CLOCK=timesfm), run on-demand — too heavy
      # (multi-GB torch + checkpoint) for routine CI; evidence: corpus/labels/forecast-gate-09M3.md.
      - name: forecast-gate wiring smoke
        run: |
          out="$(just forecast-gate obsd/internal/replay/testdata/bundle-v1 stub 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "GATE:" || { echo "FAIL: forecast pipeline produced no verdict — plumbing broken"; exit 1; }
          echo "forecast plumbing OK (verdict produced)"

  forecast-realmodel:
    name: forecast real-model loadability (TimesFM) — manual dispatch only
    # workflow_dispatch ONLY — never on the nightly schedule. The real checkpoint is a
    # multi-GB download; this verifies weekly-on-demand that the PINNED TimesFM 2.5
    # checkpoint (doc 14 A15) STILL LOADS and the real pipeline runs end-to-end against
    # it — the one regression class the stub smoke cannot catch (a packaging/API/pin
    # break). It runs against bundle-v1 (a smoke), so the verdict is correctly
    # INSUFFICIENT; we assert only that a VERDICT was produced under the REAL model. To
    # promote this to the SKILL gate of record, commit a real slow-creep capture bundle
    # and point FORECAST_BUNDLE at it (it would then assert GATE: PASSED).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORECAST_BUNDLE: obsd/internal/replay/testdata/bundle-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: forecast real-model loadability (TimesFM checkpoint still loads + runs)
        run: |
          out="$(just forecast-gate "$FORECAST_BUNDLE" timesfm 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "GATE:" || { echo "FAIL: real TimesFM pipeline produced no verdict — checkpoint/packaging broke"; exit 1; }
          echo "real-model plumbing OK (the pinned TimesFM checkpoint loads + runs)"
