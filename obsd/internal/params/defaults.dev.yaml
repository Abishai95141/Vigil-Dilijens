# Vigil parameters file (v0) — the single versioned source of every tunable constant.
# Owning doc: 14-implementation-clarifications.md §5 ("Constants adopted now").
#
# EVERY value here is an INITIAL value. Per the blueprint's open-question ledgers
# (doc 13 §6), these are revised by harness evidence (doc 11), never by intuition
# and never learned per-customer. Each carries its source citation inline.
#
# Profile: dev (kind, 3 nodes). The prod profile relaxes reconciliation to 5m and
# adds the confirm-on-demand probe (doc 14 §1.1).
version: "0"
profile: dev

scrape:
  interval: 15s                     # doc 14 §5 / A1 — we own the scraper, parse exposition format

identity:                           # doc 03 + doc 14 §1
  reconciliation: 30s               # dev backstop sweep; prod default 5m (doc 14 §1.1)
  edge_budgets:                     # doc 14 §1.2 — budget = 3 × effective confirmation interval
    runs-on: 90s                    #   pod → node
    selects: 90s                    #   service → pod (EndpointSlice-confirmed)
    mounts: 120s                    #   pod → PVC
    owns: 600s                      #   pod → ReplicaSet → Deployment (OwnerReference)
    node-lease: 40s                 #   node liveness (mirrors kube node-monitor grace)
  retracted_edge_horizon: 30m       # doc 14 §1.3 — retracted edges stay queryable this long
  tombstone:                        # doc 14 §1.4
    full_retention: 15m             #   complete identity record (late-sample join)
    stub_retention: 24h             #   succession stub (role continuity)
    max_entries: 250000             #   hard LRU cap; early eviction is a published health signal

observation:                        # doc 05 + doc 14 §A3,A5,A6
  evaluation_tick: 15s              # fingerprint evaluation cadence, aligned to scrape (A3)
  watermark: 30s                    # late-sample watermark; later samples never retro-change a fingerprint (A3)
  rate_window: 5m                   # rate primitive window, smoothed first difference (A5)
  default_cooccurrence_window: 10m  # default co-occurrence window; per-phenomenon override (§5)
  well_above_factor: 1.10           # A6 fallback: well-above = 1.10 × bar UNLESS bar = factor×limit
                                    # (factor < 1), in which case well-above = the raw limit itself.
                                    # The raw-limit branch is applied in observe/detect, not here.
  at_threshold_band: 0.05           # ladder approach zone: within 5% of the bar (healthy side) =
                                    # "at-threshold" (doc 05 §3.4/§8 — a GLOBAL display convention,
                                    # not an authored bar; calibrated in 11 M4 like well_above).

detection:                          # doc 07 §3.6 — sensitivity parameters (07 M4/M6)
  min_completeness: 0.0             # degraded matches below this required-completeness do not
                                    # surface. CALIBRATED 0 (permissive): on the labeled corpus
                                    # precision is already 1.0 at 0 (the anchor-evidence rule
                                    # carries the FP defence) while any positive threshold costs
                                    # recall on sparsely-checked phenomena (e.g. OOM_KILL_CGROUP at
                                    # 1/8 required observable) — corpus/labels/calibration-07M6.md.
  cascade_window: 10m               # trigger→downstream pairing window (doc 07 §3.4); matches the
                                    # default co-occurrence window until per-relation widths are
                                    # authored. Digest-bearing; pinned in the replay manifest.

store:                              # doc 05 §3.1 + doc 14 §2.3 — the "qss"
  hot_ring: 60m                     # in-memory ring capacity; the ONLY hot-path read surface
  warm_retention: 168h              # 7d on-disk segments (covers max TimesFM context with margin)
  segment_duration: 2h              # append-only sealed segment files
  fsync_batch: 1s                   # batched durability; losing ≤1s of telemetry on crash is acceptable

binding:                            # doc 04 + doc 14 §A4
  bar_reresolution: 30s             # re-resolve affected bars within this budget after a config event

selection:                          # doc 06 + doc 14 §5
  tier_b_budget_per_cycle: 50       # ceiling on clock invocations per cycle (dev); ranked candidates within it

forecast:                           # doc 09 + doc 14 A13/A15 — the warm path regime
  enabled: false                    # opt-in; NO warning class surfaces before its backtest gate (09 M3)
  clockd_target: "127.0.0.1:50051"  # the clock service (just clockd)
  interval: 60s                     # forecast cycle cadence; parallel, never gating the 15s tick
  deadline: 10s                     # per-RPC clock deadline; past it = degraded (A13), detection untouched
  horizon_steps: 240                # × 15s scrape = 1h dev horizon (envelope per class from 09 M3 evidence)
  quantiles: [0.1, 0.5, 0.9]        # the band edges + median; within the model head [0.1, 0.9]
  min_context: 64                   # ≥16m of history before a target may run
  flat_epsilon: 0.005               # stddev/|level| under 0.5% = flat ⇒ silence (§3.6; calibrate in M3)
  max_band_ratio: 0.5               # near cone (earliest→point) wider than 0.5× the HORIZON ⇒ silence (§3.6; absolute, never vs ttc — an imminent crossing is never suppressed)
  band_calibration: 1.0             # doc 20 P5: offline, customer-invariant scale on the clock band half-width (1.0 = identity / raw clock band; > 0; a backtest-derived constant, never online-learned)
  decompose: true                   # 09 M5: splice context at restart/deploy boundaries (no-op on clean series)
  reset_drop_fraction: 0.4          # a >40% step drop = a gauge reset (container restart) = a splice boundary
  max_explained_fraction: 0.9       # if splicing cuts >90% of the window ⇒ abort (forecast on residue is untrustworthy)
  regime_shift_flag: true           # 09 M5 companion: FLAG an undeclared upward baseline shift left in the forecast input (a config/deploy that raised the level toward the bar). NEVER auto-cleans — a ramp IS the leak; only a declared context window cleans.
  regime_shift_fraction: 0.35       # the up-jump must be ≥35% of the window's range to count (magnitude floor; below = noise)
  regime_shift_min_segment: 8       # ≥8 points each side of the shift (a sustained regime, not a transient spike)
  regime_shift_plateau: 0.35        # both old & new regimes must be roughly flat (net drift ≤ 35% of the jump): a STEP that PLATEAUS, never an ongoing or stabilising ramp (the leak-protection guard)
  trend_rescue: true                # 09 §3.6 companion: RESCUE a low-variance series with a recent sustained directional drift from the flat() silence (the late-onset leak CV cannot see). flat() alone silences it; flat() AND no recent onset silences it. Off the digest (non-gating). false ⇒ byte-identical flat()-only gate.
  trend_cusum_k: 0.5                # CUSUM per-step slack (residual-sigma units; mirrors the onset/C2 detector)
  trend_cusum_h: 4.0                # CUSUM decision threshold (residual-sigma units); <=0 disables the rescue
  trend_warmup: 12                  # head points that seed the sigma estimate, never tripped
  trend_min_z: 3.0                  # sustained pre→post shift floor (signal-sigma units): a transient spike settles back and is dropped; a real step persists (the FP defense, 0/400 on noise in the C2 sweep)
  trend_recent_window: 48           # the drift must have begun within 48 points of the series end to count as in-progress (an old step that plateaued is the regime-shift detector's jurisdiction)
  trend_min_onset_points: 6         # new-slope shorter than 6 points ⇒ forecast but FLAG early-onset (cold-start: the band firms as the slope establishes), never silenced

incident:                           # v3 T-B (doc 03 + 14 §1.4) — durable cross-run phenomenon memory; surfacing-only, off the deterministic path
  resolve_gap: 45s                  # a gap longer than this between fires of one (phenomenon, role) = a NEW recurrence (must exceed evaluation_tick)
  window_bucket: 168h               # 7d week-scale baseline window the incident key buckets on (matches the warm retention)
