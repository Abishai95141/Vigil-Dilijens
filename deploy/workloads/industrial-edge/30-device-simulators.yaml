---
# --- vibration: *** DELIBERATELY UNBOUNDED — NO LIMITS (Tier-B-ineligible) *** --
# This is the resolvability hole. It declares requests (so the scheduler can place
# it) but NO limits block: no config-sourced memory/CPU bar exists, therefore no
# crossable limit, therefore ineligible for forecasting. Vigil must LIST it on the
# coverage report as unbounded — never invent a bar, never silently skip it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-vibration
  namespace: industrial-edge
  labels:
    app.kubernetes.io/name: sim-vibration
    app.kubernetes.io/component: device-simulator
    app.kubernetes.io/part-of: industrial-edge
    vigil.dev/sensor: vibration
    vigil.dev/bar: unbounded
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sim-vibration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sim-vibration
        app.kubernetes.io/component: device-simulator
        app.kubernetes.io/part-of: industrial-edge
        vigil.dev/sensor: vibration
        vigil.dev/bar: unbounded
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
      containers:
        - name: publisher
          image: eclipse-mosquitto:2.0.20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BROKER
              value: mqtt-broker
            - name: SENSOR
              value: vibration
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                v=$(awk 'BEGIN{srand();printf "%.3f", rand()*10}')
                mosquitto_pub -h "$BROKER" -t "edge/$SENSOR/$POD_NAME" \
                  -m "{\"sensor\":\"$SENSOR\",\"device\":\"$POD_NAME\",\"value\":$v,\"unit\":\"mm_s\"}" || true
                sleep 2
              done
          # requests ONLY — NO limits stanza. This is the intentional unbounded
          # workload. Do NOT add a `limits:` block here; that would close the
          # resolvability hole the twin exists to exercise.
          resources:
            requests:
              cpu: 10m
              memory: 12Mi
