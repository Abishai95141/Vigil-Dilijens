# ABB Ability Genix predictive-maintenance simulation — namespace, config, credentials.
# Part 1 of 3 (apply 00 -> 10 -> 20). See README.md for the dependency map.
#
# These are DEMO credentials for a throwaway kind cluster — not real secrets. They exist
# so the pipeline has genuine auth dependencies (a Secret consumed by the historian,
# data lake, registry, and every sim) for Vigil to bind.
apiVersion: v1
kind: Namespace
metadata:
  name: abb-genix
  labels:
    app.kubernetes.io/part-of: abb-genix
    vigil.io/workload: abb-genix-pdm   # decorative only — NOT read by obsd (only vigil.io/slo.* annotations are)
---
# Plant topology — the asset population the smart-sensor fleet simulates. Reshape the
# plant by editing PLANT_ASSETS (the sims read it from env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: plant-topology
  namespace: abb-genix
data:
  SITE_ID: "WTP_NORDIC_01"
  AREA_ID: "pumping"
  PLANT_ASSETS: "raw-water-pump-1,raw-water-pump-2,booster-pump-1,backwash-blower-1,sludge-mixer-motor-1"
  TOPIC_ROOT: "abb/genix"
---
# Edgenius MQTT broker (Mosquitto) configuration — persistence ON so the broker is a
# genuinely stateful backbone component (a real PVC, real retained state).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: abb-genix
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 30
    max_queued_messages 100000
    log_dest stdout
---
# Grafana datasource provisioning — the operations dashboard reads the Genix historian.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: abb-genix
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: GenixHistorian
        uid: genix-historian
        type: influxdb
        access: proxy
        url: http://genix-historian:8086
        jsonData:
          version: Flux
          organization: abb
          defaultBucket: telemetry
        secureJsonData:
          # $INFLUX_TOKEN is injected into the Grafana pod from the genix-credentials
          # Secret (10-backbone.yaml) and expanded here — single source of truth.
          token: $INFLUX_TOKEN
---
# Grafana dashboard provider — points Grafana at the provisioned dashboard files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: abb-genix
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: abb-genix
        orgId: 1
        folder: "ABB Genix"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
# Plant overview dashboard — vibration + bearing temperature per asset from the historian.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-plant
  namespace: abb-genix
data:
  plant.json: |
    {
      "uid": "abb-plant",
      "title": "ABB Genix — Plant Overview",
      "tags": ["abb", "genix"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Asset vibration (g RMS)",
          "datasource": { "type": "influxdb", "uid": "genix-historian" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "influxdb", "uid": "genix-historian" },
              "query": "from(bucket: \"telemetry\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"asset_telemetry\" and r._field == \"vibration_g_rms\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> keep(columns: [\"_time\", \"_value\", \"asset\"])\n  |> group(columns: [\"asset\"])"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Bearing temperature (C)",
          "datasource": { "type": "influxdb", "uid": "genix-historian" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "celsius" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "influxdb", "uid": "genix-historian" },
              "query": "from(bucket: \"telemetry\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"asset_telemetry\" and r._field == \"bearing_temp_c\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> keep(columns: [\"_time\", \"_value\", \"asset\"])\n  |> group(columns: [\"asset\"])"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: genix-credentials
  namespace: abb-genix
type: Opaque
stringData:
  INFLUX_TOKEN: "genix-admin-token"
  INFLUX_ORG: "abb"
  INFLUX_BUCKET: "telemetry"
  INFLUX_USERNAME: "genix"
  INFLUX_PASSWORD: "genix-password"
  PG_USER: "genix"
  PG_PASSWORD: "genix-password"
  PG_DB: "assets"
  MINIO_ROOT_USER: "genix"
  MINIO_ROOT_PASSWORD: "genix-password"
