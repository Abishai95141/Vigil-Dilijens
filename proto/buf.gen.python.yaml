version: v2
# Python stubs for clockd (techstack §5: "grpcio server in Python from the same
# protos"). The `vigil` package is generated as a REAL src root next to clockd
# (clockd/src/vigil/...), installed via pyproject packages — no sys.path shims,
# no import-order sensitivity. `clean` must stay FALSE: the out dir is clockd/src,
# which also holds the handwritten clockd package; `just gen` removes the
# generated vigil/ tree explicitly before regenerating. Generated code is
# COMMITTED (techstack §2.6).
clean: false
# Remote plugins are PINNED: an unpinned remote plugin re-generates with
# whatever gencode version the registry currently serves — gen-check caught a
# silent 7.35.0→7.35.1 drift (2026-06-13). Bump deliberately, with the diff.
plugins:
  - remote: buf.build/protocolbuffers/python:v35.1
    out: ../clockd/src
  - remote: buf.build/grpc/python:v1.81.1
    out: ../clockd/src
