[project]
name = "clockd"
version = "0.0.0"
description = "Vigil forecasting 'clock' service — the model-agnostic forecaster (doc 09)."
requires-python = ">=3.12,<3.13"
# Base has NO heavy ML deps: the stub clock is pure stdlib so the swap-readiness
# test (doc 09 M1) runs anywhere. TimesFM/torch land behind the `model` extra in
# Phase 2, pinned by exact package version AND checkpoint revision (doc 14 A15).
dependencies = []

[project.optional-dependencies]
# `serve`: gRPC serving only (StubClock over the wire) — light enough for CI.
# The protobuf floor matches the buf-generated stubs' runtime requirement.
serve = [
  "grpcio>=1.80,<2",
  "protobuf>=7.35,<8",
]
# `model`: the TimesFM 2.5 reference adapter (doc 09 M1 / doc 14 A15).
# NOTE the two version lines, deliberately different: the MODEL is TimesFM 2.5
# (checkpoint google/timesfm-2.5-200m-pytorch, revision-pinned in
# src/clockd/timesfm_clock.py); the PyPI package `timesfm` is the SDK whose own
# line tops out at 2.0.x — 2.0.0 (2026-06-05) is the release that ADDED the
# 2.5-model class. No `timesfm==2.5` exists on PyPI (verified 2026-06-12).
model = [
  "timesfm[torch]==2.0.1",
  "torch==2.12.0",
  "huggingface-hub>=0.20",
  "grpcio>=1.80,<2",
  "protobuf>=7.35,<8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `vigil` is the buf-generated proto package (clock stubs), a real src root —
# regenerated by `just gen`, committed (techstack §2.6), excluded from lint.
packages = ["src/clockd", "src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# buf-generated stubs (committed, techstack §2.6) are not lint targets.
extend-exclude = ["src/vigil"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
