[project]
name = "harness"
version = "0.0.0"
description = "Vigil validation & calibration harness — offline falsification + backtests (doc 11)."
requires-python = ">=3.12,<3.13"
# numpy is in base (the backtest math uses it now). The columnar/plotting stack
# (pyarrow, polars, scipy, matplotlib — techstack §9) lands behind `analytics` as
# the suites that need it come online (replay bundles in Phase 0b, backtests in
# Phase 2). This keeps base installs and CI fast.
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
analytics = [
  "pyarrow>=17",
  "polars>=1.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
