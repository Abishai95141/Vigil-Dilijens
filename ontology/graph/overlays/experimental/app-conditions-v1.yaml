# EXPERIMENTAL — authored application-signal overlay (doc 15 cap. A).
#
# NOT in the production overlay glob: it lives under overlays/experimental/ (like
# event-conditions-v1.yaml and flow-relation-v0.yaml), so it does NOT change the released
# graph's content hash. obsd loads it ONLY behind --app-metrics-enabled (the app lane),
# alongside the released overlays. Promotion into the released ontology is a governed
# follow-up (mirroring the cross-service relation's Phase A->C, doc 15).
#
# What it authors — three application-level phenomena along the smart-traffic chain
# (doc 15 cap. A), each MEASURED against a CUSTOMER-DECLARED SLO (borrowed normativity,
# never learned). Every bar is read from a vigil.io/slo.* annotation on the workload;
# undeclared => unbounded/listed, NEVER a fabricated or default capacity:
#
#   L4 — PHEN_APP_QUEUE_SATURATION (the keystone): an app's OWN reported queue depth
#        (SIG_app_queue_depth, gauge) crossing slo.queue.max_depth. The backlog link.
#   L6 — PHEN_APP_DATA_STALENESS (the terminal, the differentiator): an app's last-update
#        timestamp (SIG_app_data_freshness, gauge of a Unix epoch) re-expressed as DATA
#        AGE = evalNow − value via the age-from-timestamp transform, crossing
#        slo.freshness.max_age. "Your serving data is older than the freshness SLO you
#        declared" — the capability no metric tool gives you SLO-relative. Robust by
#        construction: a hung app freezes its last-update while the eval clock advances,
#        so the age GROWS and the staleness is caught.
#   L1 — PHEN_APP_LOAD_SURGE (the trigger): an app's request counter (SIG_app_request_rate,
#        counter app_requests_total) rate-converted and crossing slo.requests.max_rate.
#        The 3×-load chain trigger, MEASURED — asserts nothing about what it causes.
#
# Each is entity-local with one required member and a detection check (the metric crossing
# its declared SLO IS the phenomenon). The age transform's eval clock is INJECTED, so the
# derived age is replay-deterministic and MEASURED (arithmetic over the clock + a gauge).
#
# ELIGIBILITY (the Pod analogue of the container CPU-limit gate): each rule carries
# `eligibility_config_path: slo.*` — it instantiates only on a workload the operator placed
# INSIDE the app-SLO regime by declaring at least one vigil.io/slo.* annotation. A pod that
# carries no application SLO at all (an infrastructure pod — kube-system, monitoring, CNI —
# that can never bear an application SLO) is OUT-OF-SCOPE with a stated reason, NOT unbounded:
# the rule does not apply to it, so it leaves the resolvability denominator rather than
# dragging it down. A workload IN the regime that has declared SOME but not all of these
# SLOs stays in scope and is listed UNBOUNDED for the bars it has not declared — that
# coverage gap is honest, never hidden. (Borrowed normativity: presence is read from the
# customer's OWN declared annotations, never learned or observed; honest partial coverage:
# the out-of-scope reason is surfaced verbatim by the silence ledger.)
#
# Epistemic discipline (doc 01): every finding is MEASURED (a fact: the metric crossed the
# customer's OWN declared bar). No learned baseline; undeclared SLO => unbounded/listed.
# These phenomena report what IS — relating them into a chain is Capability B's authored
# job, never inferred here.
overlay: app-conditions-v1
version: 1
author: vigil-engineering
status: experimental

signals:
  - id: SIG_app_queue_depth
    name: "Application queue depth (app /metrics)"
    data_type: gauge
    entity: Pod
    notes: "An application's own reported count of pending/unprocessed work items (e.g. a traffic-aggregation backlog). Customer-exposed on /metrics; bound to a declared SLO."
  - id: SIG_app_data_freshness
    name: "Application data freshness (last-update timestamp, app /metrics)"
    data_type: gauge
    entity: Pod
    notes: "An application's own reported Unix-epoch time of its last data/prediction update (the canonical *_last_success_timestamp_seconds pattern). Vigil re-expresses it as DATA AGE (evalNow − value) and binds the age to a declared freshness SLO. Measures freshness, NOT correctness — an on-time-but-wrong value stays out of reach (doc 15 §6)."
  - id: SIG_app_request_rate
    name: "Application request rate (request counter, app /metrics)"
    data_type: counter
    entity: Pod
    notes: "An application's own cumulative request counter (app_requests_total). Vigil rate-converts it (Δ/Δt, reset-aware) and binds the per-second rate to a declared request-capacity SLO. The chain trigger — request load over the customer's declared provisioning."

phenomena:
  - id: PHEN_APP_QUEUE_SATURATION
    label: "Application queue saturation (backlog over declared SLO)"
    signals:
      - ["app_queue_depth", "required", "T0", "the application's own reported pending-work depth"]
    notes: "The app's processing backlog has crossed the queue-depth SLO the customer declared on the workload. MEASURED against the customer's OWN bar; asserts nothing about why."
  - id: PHEN_APP_DATA_STALENESS
    label: "Application data staleness (serving data older than declared freshness SLO)"
    signals:
      - ["app_last_update_seconds", "required", "T0", "the application's own last-update timestamp, re-expressed as data age"]
    notes: "The age of the app's serving data (evalNow − last_update) has crossed the freshness SLO the customer declared. MEASURED against the customer's OWN bar. Reports STALENESS, not incorrectness — a fresh-but-wrong value is out of reach."
  - id: PHEN_APP_LOAD_SURGE
    label: "Application load surge (request rate over declared capacity)"
    signals:
      - ["app_requests_total", "required", "T0", "the application's own request counter, rate-converted"]
    notes: "The app's request rate (Δcounter/Δt) has crossed the request-capacity SLO the customer declared on the workload. MEASURED against the customer's OWN bar; the chain trigger, asserting nothing about what it causes downstream."

members:
  PHEN_APP_QUEUE_SATURATION:
    - signal: SIG_app_queue_depth
      role: required
      temporal: T0
      why: "the application's own reported pending-work depth, the direct measure of backlog"
  PHEN_APP_DATA_STALENESS:
    - signal: SIG_app_data_freshness
      role: required
      temporal: T0
      why: "the age of the application's serving data (evalNow − its last-update timestamp), the direct measure of freshness"
  PHEN_APP_LOAD_SURGE:
    - signal: SIG_app_request_rate
      role: required
      temporal: T0
      why: "the application's own request rate (its request counter, rate-converted), the direct measure of incoming load"

spans:
  PHEN_APP_QUEUE_SATURATION:
    span: entity-local
    rationale: "Queue saturation is a property of the single workload that owns the queue — its own backlog gauge against its own declared SLO. No topology walk; entity-local."
  PHEN_APP_DATA_STALENESS:
    span: entity-local
    rationale: "Data staleness is a property of the single workload serving the data — the age of its own last update against its own declared freshness SLO. No topology walk; entity-local."
  PHEN_APP_LOAD_SURGE:
    span: entity-local
    rationale: "Request-rate-over-capacity is a property of the single workload receiving the load — its own request counter against its own declared capacity SLO. No topology walk; entity-local."

rules:
  - id: THR_APP_QUEUE_DEPTH
    signal: SIG_app_queue_depth
    metric: app_queue_depth
    kind: config-relative
    config_path: slo.queue.max_depth
    eligibility_config_path: slo.*
    factor: 1.0
    direction: above
    entity_scope: Pod
    window: 5m
    rationale: >-
      The maximum acceptable queue depth is a SERVICE-LEVEL OBJECTIVE only the operator can
      declare — there is no universal "too deep". So the bar is borrowed from the customer's
      own config: the vigil.io/slo.queue.max_depth annotation on the workload (config-path
      slo.queue.max_depth), read verbatim at bind time. Where it is not declared, the pair is
      unbounded/listed — never a learned or default capacity (the charter ban on baselines).
      Eligibility-gated on the app-SLO regime (eligibility_config_path slo.*): a workload that
      declares NO application SLO is out-of-scope (the rule cannot apply — an infrastructure
      pod has no application queue), distinct from an in-regime workload that has simply not
      declared this particular bar (unbounded/listed).
  - id: THR_APP_DATA_AGE
    signal: SIG_app_data_freshness
    metric: app_last_update_seconds
    kind: config-relative
    config_path: slo.freshness.max_age
    eligibility_config_path: slo.*
    factor: 1.0
    direction: above
    entity_scope: Pod
    transform: age-from-timestamp
    window: 5m
    rationale: >-
      The maximum acceptable DATA AGE is a freshness SERVICE-LEVEL OBJECTIVE only the operator
      can declare — there is no universal "too stale". The app exposes a Unix-epoch last-update
      timestamp (app_last_update_seconds); the age-from-timestamp transform re-expresses it as
      evalNow − value (seconds) using the INJECTED eval clock, so the laddered quantity is the
      data age and the derivation stays replay-deterministic. The bar is borrowed from the
      customer's own config: the vigil.io/slo.freshness.max_age annotation (config-path
      slo.freshness.max_age, in seconds), read verbatim at bind time. Undeclared => unbounded/
      listed — never a learned or default freshness floor. Eligibility-gated on the app-SLO
      regime (eligibility_config_path slo.*): a workload that declares NO application SLO is
      out-of-scope (the rule cannot apply — an infrastructure pod serves no application data),
      distinct from an in-regime workload that has not declared this particular bar.
  - id: THR_APP_REQUEST_RATE
    signal: SIG_app_request_rate
    metric: app_requests_total
    kind: config-relative
    config_path: slo.requests.max_rate
    eligibility_config_path: slo.*
    factor: 1.0
    direction: above
    entity_scope: Pod
    window: 5m
    rationale: >-
      The maximum sustainable request rate is a capacity SERVICE-LEVEL OBJECTIVE only the
      operator can declare — there is no universal "too much load". The app exposes a cumulative
      request counter (app_requests_total); the runtime rate-converts it (Δ/Δt, reset-aware) and
      ladders the per-second rate. The bar is borrowed from the customer's own config: the
      vigil.io/slo.requests.max_rate annotation (config-path slo.requests.max_rate, in req/s),
      read verbatim at bind time. Undeclared => unbounded/listed — never a learned or default
      capacity (the charter ban on baselines). Eligibility-gated on the app-SLO regime
      (eligibility_config_path slo.*): a workload that declares NO application SLO is
      out-of-scope (the rule cannot apply — an infrastructure pod receives no application
      request load), distinct from an in-regime workload that has not declared this bar.

checks:
  PHEN_APP_QUEUE_SATURATION:
    - signal: SIG_app_queue_depth
      metric: app_queue_depth
      facet: level
      expect: crossed
      on: anchor
      note: "the app's reported queue depth has crossed the declared slo.queue.max_depth (config-sourced bar; unbounded where the SLO is not declared)"
  PHEN_APP_DATA_STALENESS:
    - signal: SIG_app_data_freshness
      metric: app_last_update_seconds
      facet: level
      expect: crossed
      on: anchor
      note: "the age of the app's serving data (evalNow − last_update) has crossed the declared slo.freshness.max_age (config-sourced bar; unbounded where the SLO is not declared). Freshness, not correctness."
  PHEN_APP_LOAD_SURGE:
    - signal: SIG_app_request_rate
      metric: app_requests_total
      facet: level
      expect: crossed
      on: anchor
      note: "the app's request rate (Δcounter/Δt) has crossed the declared slo.requests.max_rate (config-sourced bar; unbounded where the SLO is not declared)"
