# Detection member-conditions — authored overlay v2 (doc 07 §3.1/§3.2, doc 02 §3.5).
#
# Phase-1 additions: first-order (one-hop) member checks. Two new fields over v1:
#
#   anchors — the entity kind a spanned phenomenon is EVALUATED AT (doc 07 §3.2:
#             "the entity plus direct neighbours"). Authored, never inferred from
#             where variables happen to live.
#   on      — where each member's variable lives relative to the anchor:
#             anchor (default) or neighbour (one topology hop along the
#             phenomenon's declared traversal edge types). The matcher satisfies
#             neighbour checks across VALID edges only; a suspect edge DEGRADES
#             the match; an absent edge never contributes (degrade-never-
#             fabricate, doc 07 §3.2 — the trust-critical rule).
#
# Containment note (mirrors spans-v1's addressing principle): Container <-> Pod
# is identity containment, not a topology hop. A Container-anchored phenomenon
# walks runs-on FROM ITS POD; the hop count is unchanged.
#
# As in v1: a required member with NO check here is UNOBSERVABLE on this signal
# set — surfaced on the finding (degraded), never silently satisfied. The members
# referenced are the KG's own (participates_in); this file binds, never invents.
overlay: detection-conditions-v2
version: 2
author: vigil-engineering
status: proposed-v2 (first-order checks for the cAdvisor + node-exporter signal set)

anchors:
  PHEN_THROTTLING_CASCADE: Container
  PHEN_EVICTION_MEMORY: Node
  PHEN_CONNTRACK_EXHAUSTION: Node
  PHEN_OOM_KILL_SYSTEM: Node

checks:
  # CPU throttling cascade (first-order, runs-on): the throttled container is the
  # anchor; the node's CPU pressure corroborates one hop away. Required pod-side
  # latency members beyond these two have no scrapable channel here (mesh/app
  # metrics) — their absence degrades, stated.
  PHEN_THROTTLING_CASCADE:
    - signal: SIG_container_cpu_family_12_metrics_857b041d
      metric: container_cpu_cfs_throttled_periods_total
      facet: ratio
      expect: crossed
      on: anchor
      note: "throttled-period ratio over the window vs the flagged 0.25 default bar (THR_CONTAINER_CPU_THROTTLE_RATIO)"
    - signal: SIG_node_pressure_psi_12_metrics_ba96070d
      metric: node_pressure_cpu_waiting_seconds_total
      facet: level
      expect: crossed
      on: neighbour
      note: "node CPU some-stall fraction one runs-on hop from the throttled container's pod; >=10% (flagged default bar) sustains the cascade claim"

  # Kubelet memory eviction (first-order, runs-on): node-anchored. MemAvailable
  # below the allocatable-relative bar is the only scrapable required member on
  # this cluster; eviction events / node conditions / kubelet evictions counters
  # need KSM or the kubelet main endpoint (not ingested) — degraded, stated.
  PHEN_EVICTION_MEMORY:
    - signal: SIG_node_memory_family_50_metrics_from_proc_meminfo_2c1e8b7c
      metric: node_memory_MemAvailable_bytes
      facet: level
      expect: crossed
      on: anchor
      note: "MemAvailable below 10% of API-declared allocatable (THR_NODE_MEMAVAILABLE_VS_ALLOCATABLE, config-sourced); kubelet evictionHard defaults are not API-readable"

  # Conntrack exhaustion (first-order, runs-on): node-anchored. Both required T0
  # members (entries + limit) are satisfied by ONE derived variable — the
  # utilization ratio whose divisor IS the limit series; the derivation reference
  # on the fingerprint cites both streams.
  PHEN_CONNTRACK_EXHAUSTION:
    - signal: SIG_node_nf_conntrack_entries_6161e704
      metric: node_nf_conntrack_entries
      facet: ratio
      expect: crossed
      on: anchor
      note: "entries/limit utilization >=0.75 (the KG's own authored hint, flagged default bar)"
    - signal: SIG_node_nf_conntrack_entries_limit_5d3711ff
      metric: node_nf_conntrack_entries
      facet: ratio
      expect: crossed
      on: anchor
      note: "satisfied via the same utilization ratio — the limit series is the derivation's divisor stream"

  # System (host) OOM kill (first-order, runs-on): node-anchored. The vmstat
  # counter incrementing IS the event; victim evidence on pods one hop away
  # (restarts, lastState) needs KSM — degraded until that lane is ingested.
  PHEN_OOM_KILL_SYSTEM:
    - signal: SIG_node_vmstat_family_30_metrics_005633c0
      metric: node_vmstat_oom_kill
      facet: rate-guard
      expect: breached
      on: anchor
      note: ">=1 host OOM kill in the window (THR_NODE_OOM_KILL_BURST, flagged default — the event is the bar)"
