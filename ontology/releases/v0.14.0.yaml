summary: >-
  Adds the PSI (Pressure-Stall-Information) saturation lane — the docs/31 Step-3 adoption
  from the ABB_Accelerator_Proto competitor, the first of its four genuine telemetry edges.
  The new overlay psi-pressure-v1.yaml wires a previously HANGING signal class: cAdvisor's
  container_pressure_{cpu,memory,io}_*_seconds_total counters are emitted on /metrics/cadvisor
  (already scraped by FetchCAdvisor) but were referenced by no signal, rule, or phenomenon —
  ingested and inert. The overlay mints three Signal nodes (CPU "some"/waiting,
  memory "full"/stalled, IO "full"/stalled) and authors three NEW entity-local CorrelationGroup
  phenomena: PHEN_CPU_PRESSURE_SATURATION, PHEN_MEMORY_PRESSURE_SATURATION,
  PHEN_IO_PRESSURE_SATURATION (41→44 phenomena). Each carries a rate-of-change rate-guard bar
  (THR_CONTAINER_PSI_{CPU_WAITING,MEMORY_STALLED,IO_STALLED}_RATE) — the WindowDelta of stall
  seconds over the 5m observation rate-window vs a FLAGGED conservative ontology default
  (CPU 150s/≈50%, memory 30s/≈10%, IO 60s/≈20%); PSI has no customer-declared limit, so the bar
  is a flagged default exactly like THR_CONTAINER_OOM_RATE / THR_CONTAINER_RESTARTS_RATE, never
  learned. One authored cascade relation: PHEN_MEMORY_PRESSURE_SATURATION→PHEN_OOM_KILL_CGROUP
  (downstream; both anchor the same Container, so topologically valid), surfaced verbatim as the
  curated why, never an inferred direction. CHARTER-CLEAN: container_pressure_* are monotonic
  counters from the already-trusted cAdvisor source → borrowed-normativity clean, IN-DIGEST
  legitimate (rate() of a monotonic counter is deterministic → replay-byte-identical); no new
  node kind, no new endpoint, no agent write path; the bars are forecast-ineligible by
  construction (rate-guards, ReasonRateGuardBar). BEHAVIOURAL governance class (doc 12): new
  signals + phenomena + flagged-default bars bump the hash v0.13.0→v0.14.0; the base KG and every
  prior release stay byte-identical and loadable. KNOWN FOLLOW-UP (docs/31 §2.5 / R4-z): the
  PSI zero-value trap (a kernel-PSI-less cluster emitting static-zero series reads as "healthy",
  a false-confidence NO-DATA — never a false alarm, the bar cannot fire on zeros) needs a
  blindspots/silence-ledger NO-DATA floor; it is NOT expressible as a rule eligibility (the
  eligibility predicate vocabulary is closed) and is deferred. It is INACTIVE on the AWS target
  substrate, whose kernel has CONFIG_PSI=y with 450 live moving series.
