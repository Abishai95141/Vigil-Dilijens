summary: >-
  KSM object-state lane, batch 2 (graph-robustness #2 G2b): PHEN_EVICTION_MEMORY
  upgraded from a node-memory-only DEGRADED match to a fuller one by wiring its
  pod-side member. Adds threshold-rules-v4.yaml (THR_POD_EVICTED) + detect-conditions-v5.yaml
  (the evicted-pod neighbour check, one runs-on hop from the Node anchor). The member
  is fed by a NEW ingest-time LABEL-SELECT DERIVATION: kube_pod_status_evicted is the
  single-series projection of the Evicted row of the multi-series kube_pod_status_reason
  gauge (emitted only while a pod IS Evicted), so the matcher's one-series-per-(entity,
  metric) lookup can bind it. The derivation is part of the KSM dialect (like
  normalize.ksm itself), a deterministic projection of a MEASURED fact — NOT a learned
  threshold; the bar stays an authored structural flagged default (borrowed-normativity
  clean). BEHAVIOURAL-MEDIUM class (a new rule with a flagged default + a new detection
  check on an EXISTING required member; no new phenomenon, no edited default). NON-GATING:
  the check is INERT without the KSM scrape (no eviction stream => unobservable =>
  byte-identical detection). Replay-diff bounded to the GraphVersion stamp (the off-digest
  eventdetect lane is unperturbed). detect-conditions-v3's stated gap — "eviction events /
  node conditions / kubelet evictions counters need KSM or the kubelet main endpoint (not
  ingested) — degraded, stated" — is now partially closed for the eviction-events member.
