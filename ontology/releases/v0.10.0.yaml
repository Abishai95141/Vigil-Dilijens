summary: >-
  Authors a `severity` field on every phenomenon (doc 21 Phase 5) — the
  prioritisation input governance and the agent use to rank the dark-but-dangerous
  set by HARM rather than by ease-of-wiring. Severity is AUTHORED (borrowed
  normativity — the curator declares how severe a phenomenon is when it fires),
  never learned and never model-assigned, from a closed vocabulary
  critical > high > medium > low ("" = undeclared, honest partial coverage). All
  38 phenomena are curated here: critical (8) = the cluster-wide / control-plane /
  cert / node-down / data-loss family (APISERVER_OVERLOAD_APF, CERT_EXPIRY,
  CNI_FAILURE, DNS_FAILURE, ETCD_SLOW_PATH, NODE_NOT_READY, OOM_KILL_SYSTEM,
  SCHEDULING_FAILURE); high (19) = workload-down / cascading / data-at-risk / node
  resource exhaustion; medium (10) = single-workload degradation + instability;
  low (1) = housekeeping (IMAGE_GC_EVENTS). RANKING ONLY, never a detection gate:
  detection ignores severity, so the per-tick replay digest is byte-identical and
  every cluster behaves exactly as under v0.9.0 — this is a pure metadata /
  prioritisation release. The BASE KG stays immutable (as it has across every
  release): severity is authored in a new OVERLAY, phenomenon-severity-v1.yaml — a
  phenomenon-id → level map applied to the existing phenomena exactly like the span
  declarations in spans-v1.yaml. The graph hash bumps v0.9.0→v0.10.0 because the
  overlay set changed; every prior release stays loadable. graph.Phenomenon gains
  the Severity field (graph/graph.go) with the closed-vocabulary helpers
  IsValidSeverity + SeverityRank; the overlay loader (graph/overlay.go) applies the
  phenomenon_severity block and rejects an unknown level / a missing phenomenon /
  a conflicting re-declaration loudly (an authoring defect is never silently accepted).
