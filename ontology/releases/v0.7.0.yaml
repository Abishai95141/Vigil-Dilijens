summary: >-
  KSM object-state lane, batch 3 (graph-robustness #2, DISK_PID_INODE_PRESSURE): wires the
  node-anchor member of PHEN_DISK_PID_INODE_PRESSURE — the kubelet's own DiskPressure
  condition — so disk / inode exhaustion (a CRITICAL operator blind spot: a node shedding
  pods because nodefs, imagefs, or inodes ran out) becomes a visible MEASURED finding. Adds
  threshold-rules-v5.yaml (THR_NODE_DISK_PRESSURE) + detect-conditions-v6.yaml (the
  node-condition anchor check + the Node anchor declaration). The member is fed by a NEW
  ingest-time LABEL-SELECT DERIVATION: kube_node_status_disk_pressure is the single-series
  projection of kube_node_status_condition{condition="DiskPressure",status="true"} (emitted
  only while the kubelet reports the condition), so the matcher's one-series-per-(entity,
  metric) lookup can bind it. Chosen over node-exporter node_filesystem_avail_bytes
  deliberately: DiskPressure is the kubelet's SINGLE authoritative verdict over exactly the
  filesystems it evicts on, evaluated against ITS configured thresholds — cluster-agnostic
  and free of the per-(device,mountpoint,fstype) ambiguity a raw avail ratio carries (a
  ratio crossing on the wrong mount is a false positive; the wrong one healthy is a false
  negative). The derivation is part of the KSM dialect (like normalize.ksm itself), a
  deterministic projection of a MEASURED fact — NOT a learned threshold; the bar stays an
  authored structural flagged default (borrowed-normativity clean — the kubelet's own
  number, never Vigil's). BEHAVIOURAL-MEDIUM class (a new rule with a flagged default + a
  new detection check on an EXISTING required member; no new phenomenon, no edited default).
  NON-GATING: the check is INERT without the KSM scrape, and even with it the derived row is
  emitted only while a node IS disk-pressured (the healthy status="false" row never matches),
  so every cluster without an actively disk-pressured node behaves byte-identically. PID
  pressure shares this member signal and is a NAMED co-member on the degraded finding (a
  follow-up once the derivation strips selector labels so disk|pid can share one stream).
