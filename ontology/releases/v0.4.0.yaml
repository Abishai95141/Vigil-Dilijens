summary: >-
  Cross-service relation promotion (doc 15 Phase C): the v2 observed-flow cascade's
  AUTHORED relation graduates from overlays/experimental/flow-relation-v0.yaml into
  the curated graph via a new authored OVERLAY (cross-service-v0.yaml) — the base KG
  stays an immutable vendored mirror; authored phenomena + relations are versioned
  deltas like every other overlay. Adds two CorrelationGroup nodes —
  PHEN_UPSTREAM_DEGRADATION (the callee whose own signal degrades, T0) and
  PHEN_DOWNSTREAM_IMPACT (its direct callers impacted over the observed-flow edge,
  T0+) — one directed phenomenon_relation edge between them (role downstream, temporal
  T0->T0+), and their spans (the first to declare the v2 "flow" traversal edge type,
  also added to graph.knownTraversalEdgeTypes). Surfaced verbatim with release
  provenance; obsd reads it via flow.RelationFromGraph. BEHAVIOURAL-MEDIUM class: the
  relation is AUTHORED-by-construction (a hand-written edge, no learned value); the
  two phenomena carry inline measurable-signal hints but NO participates_in members,
  NO threshold rules, and NO detection conditions — so they enter neither the
  selection funnel (TierASet reads participates_in members + checks, not inline
  signals) nor the matcher, and the deterministic digest is BYTE-IDENTICAL (proven by
  the ReplayDiff / detection-neutrality check). Native MEASURED caller-side detection
  over the flow span is the directed-flow-span follow-up (doc 15 Phase D-native).
