# ABB scenario 5 — "when will the historian disk fill?" answered with a PROJECTED
# crossing-anticipation that carries a band (never a point).
#
# Industrial shape: a process historian whose retention volume fills slowly and
# linearly as it appends telemetry. The container declares its OWN
# ephemeral-storage limit (64Mi) — THIS is the customer-declared bar (borrowed
# normativity), fully resolvable on this pod. It writes ~6Mi/min to its writable
# layer up to 58Mi then HOLDS (below the 64Mi limit: no eviction).
#
# What Vigil reports (and the charter lines this scenario defends):
#   • MEASURED now: container_fs_usage_bytes rising; while still SUB-BAR it is a
#     healthy-but-rising series (the disk-fill bar = 0.85x64Mi = 54.4Mi).
#   • PROJECTED soon: the clock (TimesFM) forecasts the series crossing the 54.4Mi
#     bar ~minutes ahead, emitted as a crossing-anticipation with a mandatory
#     uncertainty BAND that NEVER collapses to a line. PHEN_DISK_FILLING is the
#     MEASURED phenomenon the forecast anticipates.
#
# THE DISCIPLINE: the forecast is PROJECTED and must be surfaced as PROJECTED —
# never restated as MEASURED. The band is mandatory; a point estimate is a charter
# violation. Detection is NON-GATING: if the clock is absent/degraded the MEASURED
# rising-disk finding is unchanged and the forecast is simply absent (no fabricated
# ETA). The bar is the DECLARED ephemeral-storage limit, never a learned one.
#
# SAFETY: double-bounded, identical to corpus/chaos/disk-fill-ephemeral.yaml.
# (1) the 58-iteration cap stops under the 64Mi limit (kubelet never evicts);
# (2) writes go to the container's OWN /tmp writable layer, never a hostPath/PVC,
# so node disk is untouched. memory limit caps the process. Teardown: delete the
# deployment, NOT `delete -f`.
apiVersion: v1
kind: Namespace
metadata:
  name: abb-industrial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historian-retention
  namespace: abb-industrial
  labels:
    app: historian-retention
    vigil.io/role: historian
spec:
  replicas: 1
  selector:
    matchLabels: {app: historian-retention}
  template:
    metadata:
      labels: {app: historian-retention, vigil.io/role: historian}
    spec:
      containers:
        - name: filler
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              # Linear ~6 MiB/min fill of the container's own writable layer to
              # 58Mi, approaching 0.85x64Mi = 54.4Mi (the bar) while rising, then
              # HOLD below the 64Mi limit (no eviction). The slow, smooth ramp is
              # the forecast sweet spot: the clock projects the crossing ~minutes
              # ahead with a band before the MEASURED at-threshold finding fires.
              i=0
              while [ "$i" -lt 58 ]; do
                dd if=/dev/zero of=/tmp/seg-$i.tsm bs=1M count=1 2>/dev/null
                i=$((i+1))
                sleep 10
              done
              echo "retention fill complete at ${i}MiB — holding below the limit"
              sleep 100000
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
              ephemeral-storage: 64Mi
            # The declared ephemeral-storage limit IS the bar (borrowed normativity):
            # the disk-fill bar resolves to 0.85 x 64Mi = 54.4Mi.
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
