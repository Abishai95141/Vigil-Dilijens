# Chaos: the CPU-throttling-cascade scenario (doc 07 M2 live verification;
# corpus item for the doc 11 falsification suite).
#
# Two deliberate pressures on ONE node (vigil-worker2):
#   throttle-victim — a spinner with a tiny CPU limit (100m): its CFS
#       throttled-period ratio crosses the 0.25 default bar within ~2 windows.
#       This is PHEN_THROTTLING_CASCADE's required T0, on the Container anchor.
#   cpu-hog — unlimited spinners (12 runnable threads on a 10-CPU node):
#       node-wide runqueue contention drives /proc/pressure cpu some-stall
#       above the 0.10 default bar. This is the required T0+ PSI member, one
#       runs-on hop from the victim's pod.
#
# Expected: ONE first-order FULL match anchored at the victim container, span
# path pod -> vigil-worker2 over a valid runs-on edge. Tearing down cpu-hog
# alone must drop the match (PSI member observable-and-not-met fails the
# conjunction — throttling without node pressure is not the cascade).
apiVersion: v1
kind: Namespace
metadata:
  name: chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: throttle-victim
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels: {app: throttle-victim}
  template:
    metadata:
      labels: {app: throttle-victim}
    spec:
      nodeSelector:
        kubernetes.io/hostname: vigil-worker2
      containers:
        - name: spinner
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            # The declared limit IS the bar's eligibility (borrowed normativity):
            # a 100m limit under a full-speed spinner throttles ~90% of periods.
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-hog
  namespace: chaos
spec:
  replicas: 6
  selector:
    matchLabels: {app: cpu-hog}
  template:
    metadata:
      labels: {app: cpu-hog}
    spec:
      nodeSelector:
        kubernetes.io/hostname: vigil-worker2
      containers:
        - name: hog
          image: busybox:1.36
          # Two spinner processes per pod: 12 runnable threads on a 10-CPU node.
          command: ["sh", "-c", "(while true; do :; done) & while true; do :; done"]
          resources:
            requests: {cpu: 100m, memory: 16Mi}
            # No CPU limit: hogs must contend for the node, not get throttled
            # (an unthrottled hog is what creates PSI pressure). Memory bounded.
            limits: {memory: 32Mi}
