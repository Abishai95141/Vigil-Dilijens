apiVersion: v1
kind: Namespace
metadata: { name: chaos }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appsig
  namespace: chaos
  labels: { app: appsig }
spec:
  replicas: 1
  selector: { matchLabels: { app: appsig } }
  template:
    metadata:
      labels: { app: appsig }
      annotations:
        # --- Cap A scrape opt-in (read from the POD by discoverAppTargets; pod must be Running) ---
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        # --- Cap A declared SLO bars (read from the POD by SnapshotConfig: key minus vigil.io/ IS the config path) ---
        # config-relative, factor 1.0, direction=above  =>  finding fires when the measured quantity EXCEEDS the bar.
        vigil.io/slo.queue.max_depth: "100"     # THR_APP_QUEUE_DEPTH bar (L4): queue depth > 100 => PHEN_APP_QUEUE_SATURATION
        vigil.io/slo.freshness.max_age: "60"    # THR_APP_DATA_AGE bar (L6), SECONDS: (evalNow - last_update) > 60s => PHEN_APP_DATA_STALENESS
        vigil.io/slo.requests.max_rate: "50"    # THR_APP_REQUEST_RATE bar (L1), req/s: rate(app_requests_total) > 50 => PHEN_APP_LOAD_SURGE
    spec:
      containers:
        - name: server
          image: python:3.12-alpine
          command: ["python3", "-u", "-c"]
          args:
            - |
              import http.server, socketserver, threading, time, urllib.parse
              # In-memory control state. All three Cap-A metrics are exposed LABEL-FREE so that
              # exactly ONE stream resolves per (pod, metric) — Materialize binds only when
              # len(StreamsFor(uid, metric)) == 1, so a labelled series would split into many
              # streams and silently fail to bind.
              S = {"queue": 0.0, "requests": 0.0, "rate": 1.0, "frozen": False}
              # last_update is a Unix epoch gauge; the heartbeat refreshes it to now() every second
              # UNLESS frozen. When frozen, the gauge stops advancing while obsd's INJECTED evalNow
              # keeps moving, so age = evalNow - value GROWS and crosses the freshness SLO (L6).
              S["last_update"] = time.time()
              lock = threading.Lock()
              def heartbeat():
                  # advance the request counter at S['rate'] req/s (1s tick) and refresh freshness.
                  while True:
                      time.sleep(1.0)
                      with lock:
                          S["requests"] += S["rate"]            # cumulative counter, reset-aware rate over 5m window
                          if not S["frozen"]:
                              S["last_update"] = time.time()    # fresh: age stays ~0
              threading.Thread(target=heartbeat, daemon=True).start()
              class H(http.server.BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def _txt(self, code, body):
                      self.send_response(code)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.end_headers()
                      self.wfile.write(body.encode())
                  def do_GET(self):
                      u = urllib.parse.urlparse(self.path)
                      if u.path == "/metrics":
                          with lock:
                              q, r, lu = S["queue"], S["requests"], S["last_update"]
                          body = (
                              "# HELP app_queue_depth Pending work items (app-reported backlog).\n"
                              "# TYPE app_queue_depth gauge\n"
                              f"app_queue_depth {q}\n"
                              "# HELP app_requests_total Cumulative requests served.\n"
                              "# TYPE app_requests_total counter\n"
                              f"app_requests_total {r}\n"
                              "# HELP app_last_update_seconds Unix epoch of last successful update.\n"
                              "# TYPE app_last_update_seconds gauge\n"
                              f"app_last_update_seconds {lu}\n"
                          )
                          return self._txt(200, body)
                      if u.path == "/ctl":
                          # control surface: /ctl?queue=250  /ctl?frozen=1  /ctl?rate=120  (combinable)
                          qs = urllib.parse.parse_qs(u.query)
                          with lock:
                              if "queue" in qs:  S["queue"] = float(qs["queue"][0])
                              if "rate"  in qs:  S["rate"]  = float(qs["rate"][0])
                              if "frozen" in qs: S["frozen"] = qs["frozen"][0] in ("1","true","yes","on")
                              snap = dict(S)
                          return self._txt(200, f"ok {snap}\n")
                      if u.path in ("/", "/healthz"):
                          return self._txt(200, "appsig ok\n")
                      return self._txt(404, "not found\n")
              class TS(socketserver.ThreadingMixIn, http.server.HTTPServer): daemon_threads = True
              TS(("0.0.0.0", 8080), H).serve_forever()
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: appsig
  namespace: chaos
spec:
  selector: { app: appsig }
  ports: [{ port: 8080, targetPort: 8080 }]
